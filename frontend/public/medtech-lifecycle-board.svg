<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">MedTech product investigation lifecycle</title><desc id="desc">A governed workflow from product design through manufacturing and post-market signals to evidence and human decision.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f4faf8"/><stop offset="1" stop-color="#edf3f7"/></linearGradient><linearGradient id="decision" x1="0" x2="1"><stop stop-color="#0e6f68"/><stop offset="1" stop-color="#12324a"/></linearGradient></defs><rect width="1200" height="430" rx="28" fill="url(#bg)"/><path d="M150 215H1050" stroke="#9bbfc0" stroke-width="7" stroke-linecap="round" stroke-dasharray="12 14"/><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(70 120)"><rect width="160" height="190" rx="18" fill="#fff" stroke="#c5d9dc" stroke-width="3"/><circle cx="80" cy="65" r="35" fill="#dff4ef"/><path d="M61 65h38M80 46v38" stroke="#0e6f68" stroke-width="7" stroke-linecap="round"/><text x="80" y="130" fill="#102a3b" font-size="20" font-weight="700">Product</text><text x="80" y="157" fill="#587080" font-size="15">design &amp; version</text></g><g transform="translate(275 120)"><rect width="160" height="190" rx="18" fill="#fff" stroke="#c5d9dc" stroke-width="3"/><circle cx="80" cy="65" r="35" fill="#e7f0f5"/><path d="M58 78h44M64 53h32M70 65h20" stroke="#315b72" stroke-width="7" stroke-linecap="round"/><text x="80" y="130" fill="#102a3b" font-size="20" font-weight="700">Build</text><text x="80" y="157" fill="#587080" font-size="15">supplier &amp; lot</text></g><g transform="translate(480 120)"><rect width="160" height="190" rx="18" fill="#fff" stroke="#c5d9dc" stroke-width="3"/><circle cx="80" cy="65" r="35" fill="#fff0d4"/><path d="M80 43v26M80 82v2" stroke="#a06b1d" stroke-width="8" stroke-linecap="round"/><text x="80" y="130" fill="#102a3b" font-size="20" font-weight="700">Signals</text><text x="80" y="157" fill="#587080" font-size="15">complaints &amp; change</text></g><g transform="translate(685 120)"><rect width="160" height="190" rx="18" fill="#fff" stroke="#c5d9dc" stroke-width="3"/><circle cx="80" cy="65" r="35" fill="#e5f3f1"/><path d="m59 66 14 14 29-34" stroke="#0e6f68" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="130" fill="#102a3b" font-size="20" font-weight="700">Evidence</text><text x="80" y="157" fill="#587080" font-size="15">provenance &amp; gaps</text></g><g transform="translate(890 120)"><rect width="220" height="190" rx="18" fill="url(#decision)"/><circle cx="110" cy="65" r="35" fill="#dff4ef"/><path d="m89 66 14 14 29-34" stroke="#0e6f68" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="130" fill="#fff" font-size="20" font-weight="700">Human decision</text><text x="110" y="157" fill="#d7ebe9" font-size="15">reviewed &amp; traceable</text></g></g><text x="600" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#102a3b">One connected MedTech investigation story</text></svg>
