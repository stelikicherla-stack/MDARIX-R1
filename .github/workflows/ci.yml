name: MDARIX R1 CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: mdarix-r1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: mdarix_app
      POSTGRES_PASSWORD: mdarix_app
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: mdarix_r1
      # The migration chain includes the explicit database-hardening gate.
      # CI uses the freshly provisioned PostgreSQL service, so it is safe to
      # apply the runtime-role and RLS migration during the isolated run.
      MDARIX_DB_HARDENING_APPLY: '1'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mdarix_app
          POSTGRES_PASSWORD: mdarix_app
          POSTGRES_DB: mdarix_r1
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U mdarix_app -d mdarix_r1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pip-audit
      - run: python -m pip check
      - run: pip-audit -r requirements.txt
      - name: Apply complete schema and runtime hardening
        run: alembic upgrade head
      - name: Seed deterministic test identities
        env:
          DAY35_FIXTURE_APPLY: '1'
          DAY35_FIXTURE_PASSWORD: 'LegacyTestPassword123!'
        run: python scripts/provision_day35_fixture.py
      - run: python -m compileall backend auth access_control counterfactual graph scenario_intelligence
      - run: python -m pytest -q
      - name: Validate compose configuration
        run: docker compose config --quiet
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm.cmd --prefix frontend ci
      - run: npm.cmd --prefix frontend audit --audit-level=high
      - run: npm.cmd --prefix frontend run build
      - name: Run frontend tests
        run: npm.cmd --prefix frontend test -- --run

  container-validation:
    name: Container and simulator validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose definition
        run: docker compose config --quiet
      - name: Build simulator and worker images
        run: docker compose build --no-cache mdarix-outbox-worker trackwise-simulator plm-simulator erp-simulator supplier-simulator

  release-report:
    name: Release evidence gate
    runs-on: ubuntu-latest
    needs: [backend, frontend, container-validation]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Enforce required CI jobs
        shell: bash
        run: |
          test "${{ needs.backend.result }}" = success
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.container-validation.result }}" = success
      - name: Publish workflow summary
        shell: bash
        run: |
          {
            echo '## MDARIX R1 CI/CD validation'
            echo '- Backend tests, migrations, dependency checks, and compose validation: passed'
            echo '- Frontend tests, audit, and production build: passed'
            echo '- Worker and simulator container builds: passed'
            echo '- Production deployment promotion and rollback remain environment-specific gates.'
          } >> "$GITHUB_STEP_SUMMARY"
